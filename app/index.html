<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>MuseTab</title>
    <style>
      #boot-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:#f3ecdd;color:#3a3127;font:16px "Songti","Source Han Serif SC",serif;z-index:9999;}#boot-loading i{width:24px;height:24px;border:2px solid #e9e0cc;border-top-color:#b4573c;border-radius:50%;animation:boot-spin .8s linear infinite;}html[data-theme=dark] #boot-loading{background:#201a14;color:#e2d8c3;}html[data-theme=dark] #boot-loading i{border-color:#18130e;border-top-color:#d98063;}@keyframes boot-spin{to{transform:rotate(360deg);}}@media(prefers-reduced-motion:reduce){#boot-loading i{animation:none;}}
    </style>
    <link rel="preload" href="/fonts/NewCM10-Book.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NotoSerifSC-subset-VF.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // 首帧前定好主题，避免闪烁。偏好：auto | light | dark
      (function () {
        var pref = 'auto';
        try {
          pref = localStorage.getItem('musetab.theme') || 'auto';
        } catch (e) {}
        var m = /[?&]theme=(light|dark|auto)/.exec(location.hash);
        if (m) pref = m[1];
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="boot-loading" role="status"><i aria-hidden="true"></i><span>正在启动 MuseTab…</span></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
