name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app check
      - run: node tools/verify-composer-session.mjs
      - name: Verified native runtime
        run: node tools/runtime.mjs
      - name: Signing key
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE) { throw 'Missing release signing key' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/musetab.keystore",[Convert]::FromBase64String($env:KEYSTORE))
      - name: Build signed APK
        shell: pwsh
        run: |
          $env:MUSETAB_KEYSTORE="$env:RUNNER_TEMP/musetab.keystore"
          $env:MUSETAB_BUILD_ROOT="$env:RUNNER_TEMP/MuseTabBuild"
          $env:MUSETAB_PYTHON=(Get-Command python).Source
          node android/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/release-metadata.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          node tools/verify-apk-installable.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $preview=$env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+-'
          $releaseFlags=@('--draft')
          if ($preview) { $releaseFlags+='--prerelease' }
          gh release create $env:GITHUB_REF_NAME release/MuseTab-*.apk release/MuseTab-*.sha256 release/update.json --verify-tag --title "MuseTab $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md @releaseFlags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($preview) { gh release edit $env:GITHUB_REF_NAME --draft=false --prerelease --latest=false }
          else { gh release edit $env:GITHUB_REF_NAME --draft=false --latest }
      - name: Remove runner signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/musetab.keystore" -Force -ErrorAction SilentlyContinue
